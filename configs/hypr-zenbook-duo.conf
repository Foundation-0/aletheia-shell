# Hyprland Dual-Display Exoskeleton Configuration for ASUS Zenbook Pro Duo
# Source from $HOME/.config/hypr/hyprland.conf:
#   source = $HOME/.config/hypr/aletheia-zenbook-duo.conf
#
# Ring-0 Desktop VRAM Lock (Moissanite-Labs/ml-os):
#   Keep the Wayland compositor bound strictly to the integrated GPU (AMD Ryzen
#   amdgpu or Intel i915/xe) so the discrete RTX 3080 sits at 0 MiB desktop VRAM
#   and reserves 100% of its 8 GiB VRAM for CUDA / ml-os gpu-lease workloads.
#   Verify card indices with `ls -l /dev/dri/by-path/` before overriding AQ_DRM_DEVICES.

# Uncomment the verified iGPU-only DRM device path reported by `mlos probe --json`:
# env = AQ_DRM_DEVICES,/dev/dri/card1
env = __GLX_VENDOR_LIBRARY_NAME,mesa
env = LIBVA_DRIVER_NAME,auto

# Upper Primary Display (OLED / IPS main panel)
monitor = eDP-1, preferred, 0x0, 1.5

# Lower ScreenPad Plus (stacked directly beneath primary display)
# Adjust connector name (eDP-2 or DP-*) to match `hyprctl monitors all`.
monitor = eDP-2, preferred, 0x1440, 1.5

# Bind touch digitizer on the lower ScreenPad Plus to its own output
device {
    name = elan-touchscreen-screenpad-plus
    output = eDP-2
}

# Pin workspace 9 exclusively to the lower ScreenPad Plus for telemetry & board
workspace = 9, monitor:eDP-2, default:true, persistent:true

# Window rules for the ScreenPad Plus telemetry terminals
windowrulev2 = workspace 9 silent, class:^(aletheia-toroid-hud)$
windowrulev2 = workspace 9 silent, class:^(aletheia-swarm-board)$
windowrulev2 = noborder, class:^(aletheia-toroid-hud)$

# Optional ScreenPad Plus autostart (uncomment after setting ALETHEIA_CID in environment):
# exec-once = alacritty --class aletheia-toroid-hud -e python3 -I -B $HOME/Projects/expedition/publish/aletheia-shell/bin/toroid-hud.py --watch
